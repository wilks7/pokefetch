name: Release

# Push a tag (git tag v0.1.0 && git push origin v0.1.0) to build a binary and
# attach it to a GitHub Release. Nothing else is automated.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the full sprite bundle
        run: POKEFETCH_BUNDLE=retro-master cargo build --release --locked --features bundle-assets
      - name: Archive
        run: tar -czf pokefetch-macos-arm64.tar.gz -C target/release pokefetch
      - uses: softprops/action-gh-release@v2
        with:
          files: pokefetch-macos-arm64.tar.gz
          generate_release_notes: true
