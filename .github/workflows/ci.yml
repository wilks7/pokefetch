name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The flavor the release workflow builds, and the only thing that
      # exercises the full asset manifest end to end.
      - run: POKEFETCH_BUNDLE=retro-master cargo clippy --all-targets --features bundle-assets -- -D warnings
      - run: POKEFETCH_BUNDLE=retro-master cargo test --features bundle-assets
      - run: cargo doc --no-deps
