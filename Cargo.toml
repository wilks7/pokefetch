[package]
name = "pokefetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Michael Wilk"]
description = "Palette-driven Pokemon terminal greeting and sprite renderer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wilks7/pokefetch"
homepage = "https://github.com/wilks7/pokefetch"
keywords = ["pokemon", "terminal", "sprites", "cli"]
categories = ["command-line-interface", "command-line-utilities"]
publish = false

[features]
default = []
bundle-gen1 = []
bundle-assets = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hostname = "0.4"
icns = { version = "0.4", default-features = false, features = ["pngio"] }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
ureq = "3"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# Lints live here rather than as `#![warn(..)]` attributes in lib.rs, which is
# the modern convention: one place, and it applies to build.rs and both
# binaries too. `pedantic` is a deliberately opinionated group -- it is not a
# bug list, it is a style teacher, which is exactly what this repository wants.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Doc comments on private items are optional; on public ones they are not.
missing_panics_doc = "allow"
# `crate::config::Config` reads better than inventing non-repeating names.
module_name_repetitions = "allow"
# `#[must_use]` earns its keep on a builder or a costly computation. On a
# three-line getter it is noise, and this crate is mostly getters.
must_use_candidate = "allow"

# `.cargo/config.toml` passes `--document-private-items`, so links from public
# docs into private helpers do resolve in the generated site. The lint does not
# know that, and here those links are the point.
[lints.rustdoc]
private_intra_doc_links = "allow"

[profile.release]
lto = "thin"
strip = true
