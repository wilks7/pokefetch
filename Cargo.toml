[package]
name = "pokefetch"
version = "0.1.0"
edition = "2021"
authors = ["Michael Wilk"]
description = "Palette-driven Pokemon terminal greeting and sprite renderer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wilks7/pokefetch"
homepage = "https://github.com/wilks7/pokefetch"
keywords = ["pokemon", "terminal", "sprites", "cli"]
categories = ["command-line-interface", "command-line-utilities"]
publish = false

[features]
default = []
bundle-gen1 = []
bundle-assets = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hostname = "0.4"
icns = { version = "0.4", default-features = false, features = ["pngio"] }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
ureq = "3"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
