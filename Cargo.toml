[package]
name = "pokefetch"
version = "0.1.0"
edition = "2021"
description = "Michael's palette-driven Pokemon greeting and Ghostty icon"
license = "MIT"

[features]
default = []
bundle-gen1 = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hostname = "0.4"
icns = { version = "0.4", default-features = false, features = ["pngio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
ureq = "3"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
