schema_version = 1

# A bundle controls build-time contents. Runtime selection policy remains a
# separate concern. `core` uses the owning set's explicit core_ranges; `full`
# includes every imported species the upstream game set actually provides.

[[bundles]]
id = "red-blue-core"
members = [{ set = "red-blue", scope = "core", variants = ["*"] }]

[[bundles]]
id = "red-blue-full"
members = [{ set = "red-blue", scope = "full", variants = ["*"] }]

